<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery Guide</title>

<!--
  PRODUCTION STARTER — read this before deploying

  This is the real file you deploy once you have an ElevenLabs Conversational AI
  agent set up (see SETUP-GUIDE.md for the full walkthrough). It is NOT the
  interactive mockup you saw in chat — that one used scripted, fake responses
  with no AI behind it. This file wires up a REAL conversational agent.

  Three things you must do before this works:
    1. Create a free ElevenLabs account and a Conversational AI agent
       (elevenlabs.io -> Conversational AI -> Create an agent).
    2. Paste your agent's system prompt from SETUP-GUIDE.md into the agent's
       "System prompt" field in the ElevenLabs dashboard.
    3. Replace YOUR_AGENT_ID_HERE below with the agent ID ElevenLabs gives you.

  Then host this single file anywhere (Netlify Drop, GitHub Pages, Vercel —
  see SETUP-GUIDE.md) and point your QR code at that URL.
-->

<style>
  :root{
    color-scheme: light dark;
    --bg:#ECEEEA; --ink:#1B211F; --ink-soft:#4B534E; --accent:#3F6D5C; --line:#D3D6CE;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141B17; --ink:#E9EBE4; --ink-soft:#A9B2AB; --accent:#74AD90; --line:#2E3A33; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:32px 20px; text-align:center; gap:18px;
  }
  h1{ font-size:1.4rem; margin:0; }
  p{ color:var(--ink-soft); max-width:38ch; margin:0; font-size:.95rem; line-height:1.5; }
  .badge{
    font-size:.68rem; letter-spacing:.08em; text-transform:uppercase;
    border:1px solid var(--line); border-radius:100px; padding:5px 12px; color:var(--ink-soft);
  }
</style>
</head>
<body>

  <span class="badge">Scan &amp; talk</span>
  <h1>Ask me anything about the gallery</h1>
  <p>Directions, opening hours, the current show, or flag someone down — just start talking or typing.</p>

  <!--
    ElevenLabs Conversational AI widget.
    Docs: https://elevenlabs.io/docs/conversational-ai/customization/widget
    Replace agent-id with your real agent's ID (found in the ElevenLabs
    dashboard under your agent's settings, or the embed snippet it gives you).
  -->
  <elevenlabs-convai agent-id="https://elevenlabs.io/app/talk-to?agent_id=agent_6001m236r2k1es4ss2cdyw4jd5vt&branch_id=agtbrch_6201m236r4rcec9sr55mk2577kft"></elevenlabs-convai>
  <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

</body>
</html>
